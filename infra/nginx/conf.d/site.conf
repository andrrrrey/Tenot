## Nginx reverse proxy for MVP (Next.js + NestJS)
## Domains:
## - test.tenot.ru (primary)
##
##
## Before enabling HTTPS:
## 1) Ensure infra/nginx/www exists (for ACME webroot)
## 2) Obtain certificates with certbot (see README_DEPLOY.md)

# Rate limiting zones (http context)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

# Map for correct Connection header:
#   - WebSocket requests → "upgrade"
#   - Normal HTTP requests → "" (keeps keepalive alive)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# Upstream pool with persistent (keepalive) connections to Next.js
upstream nextjs_backend {
  server web:3000;
  keepalive 32;
  keepalive_requests 1000;
  keepalive_timeout 120s;
}

# --- HTTP: ACME challenge + redirect to HTTPS ---
server {
  listen 80;
  server_name test.tenot.ru;

  # Let's Encrypt HTTP-01 challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect everything else to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS ---
server {
  listen 443 ssl;
  http2 on;
  server_name test.tenot.ru;

  # Primary certificate path (tenot.ru)
  ssl_certificate     /etc/letsencrypt/live/test.tenot.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/test.tenot.ru/privkey.pem;

  # Security-ish defaults (lightweight)
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_session_tickets off;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Block known malicious user-agents and empty ones
  if ($http_user_agent ~* (curl|wget|python|scanner|nikto|masscan|zgrab|bot)) {
    return 403;
  }
  if ($http_user_agent = "") {
    return 403;
  }

  # Never expose WWW-Authenticate to the browser — prevents the native
  # "Sign in" popup that Chrome shows on 401 responses with this header.
  proxy_hide_header WWW-Authenticate;

  # Docker embedded DNS — fallback resolver
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Proxy timeouts — increased to prevent 504 on slow responses
  proxy_connect_timeout 120s;
  proxy_send_timeout    120s;
  proxy_read_timeout    120s;
  proxy_socket_keepalive on;
  proxy_buffering off;
  client_max_body_size 10M;

  # Retry on upstream connection errors (safe: won't retry POSTs after body is sent)
  proxy_next_upstream error timeout http_502 http_504;
  proxy_next_upstream_timeout 30s;
  proxy_next_upstream_tries 2;

  # Frontend (Next.js) serves both UI and Next API routes (/api/*)
  location / {
    limit_req zone=general burst=20 nodelay;

    proxy_pass http://nextjs_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # API proxy — stricter rate limit
  location /api/ {
    limit_req zone=api burst=10 nodelay;

    proxy_pass http://nextjs_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # /admin — protected by application-level JWT auth + RBAC (Roles guard).
  # No additional HTTP Basic Auth needed; the frontend useRequireRole(['ADMIN'])
  # and backend @Roles('ADMIN') guard already enforce access control.
  location ^~ /admin {
    proxy_pass http://nextjs_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
