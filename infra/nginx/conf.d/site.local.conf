## Local dev/prod-like reverse proxy (HTTP only)
## Use with: docker compose -f docker-compose.local.yml up -d --build

server {
  listen 80;
  server_name localhost;

  # Docker embedded DNS — re-resolve upstream on every request
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Proxy timeouts — match production values
  proxy_connect_timeout 120s;
  proxy_send_timeout    120s;
  proxy_read_timeout    120s;
  client_max_body_size 25M;

  # Uploaded files — proxy directly to API backend
  location /uploads/ {
    set $upstream_api http://api:3001;
    proxy_pass $upstream_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    set $upstream_web http://web:3000;
    proxy_pass $upstream_web$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
