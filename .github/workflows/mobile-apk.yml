name: Mobile APK

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Адрес backend (по умолчанию https://tenot.ru)'
        required: false
        default: 'https://tenot.ru'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ и тесты
        run: |
          flutter analyze
          flutter test

      - name: Сборка APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://tenot.ru' }}
          cp build/app/outputs/flutter-apk/app-release.apk build/tenot-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tenot-apk
          path: mobile/build/tenot-${{ github.run_number }}.apk
          retention-days: 30
